<text class="muted" x="378.6" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">20%</text>
<text class="muted" x="442.9" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">30%</text>
<text class="muted" x="507.1" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">40%</text>
<text class="muted" x="571.4" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">50%</text>
<text class="muted" x="635.7" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">60%</text>
<text class="muted" x="700" y="256" font-size="11.5" fill="#57606a" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">70%</text>
<text class="muted" x="16" y="278" font-size="11" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">n = 286 frozen test rows per configuration; single run per model; deltas are adapter minus base.</text>
