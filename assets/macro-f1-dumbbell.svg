<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" role="img" aria-labelledby="macro-f1-title" aria-describedby="macro-f1-desc">
<title id="macro-f1-title">Mean aspect macro-F1: base checkpoint vs LoRA fine-tune, HoASA</title>
<desc id="macro-f1-desc">Dumbbell chart of mean aspect macro-F1 for four HoASA configurations on the frozen 286-row test split, base checkpoint versus LoRA fine-tune, ordered by gain. Open circles are base checkpoints, filled circles are fine-tuned adapters, and the signed value at right is adapter minus base in percentage points. LFM2.5-1.2B-Instruct: 0.0569 to 0.6647 (+60.8 pp); Qwen3.5-0.8B: 0.2527 to 0.6921 (+43.9 pp); Qwen3-1.7B: 0.3421 to 0.6894 (+34.7 pp); Qwen3.5-2B: 0.4750 to 0.6763 (+20.1 pp). A dashed vertical line marks the shared majority baseline at 0.2217.</desc>
<rect class="card" x="0.5" y="0.5" width="859" height="289" rx="8" fill="#ffffff" stroke="#d0d7de"/>
<text class="ink" x="16" y="27" font-size="14" font-weight="700" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Mean aspect macro-F1 &#8212; base versus LoRA</text>
<circle class="hollow" cx="628" cy="23" r="4" fill="#ffffff" stroke="#6e7781" stroke-width="1.5"/>
<text class="muted" x="638" y="27" font-size="11.5" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">base</text>
<circle class="dot" cx="688" cy="23" r="5.5" fill="#0969da"/>
<text class="muted" x="698" y="27" font-size="11.5" fill="#57606a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">LoRA</text>
<line class="grid" x1="314.3" y1="44" x2="314.3" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="grid" x1="378.6" y1="44" x2="378.6" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="grid" x1="442.9" y1="44" x2="442.9" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="grid" x1="507.1" y1="44" x2="507.1" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="grid" x1="571.4" y1="44" x2="571.4" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="grid" x1="635.7" y1="44" x2="635.7" y2="240" stroke="#eaeef2" stroke-width="1"/>
<line class="maj" x1="392.5" y1="44" x2="392.5" y2="240" stroke="#bf8700" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="maj-label" x="392.5" y="40" font-size="11" fill="#bf8700" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">majority baseline 0.2217</text>
<text class="ink" x="16" y="80.5" font-size="13.5" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">LFM2.5-1.2B-Instruct</text>
<line class="bar" x1="286.6" y1="76" x2="677.3" y2="76" stroke="#d0d7de" stroke-width="2"/>
<circle class="hollow" cx="286.6" cy="76" r="4.5" fill="#ffffff" stroke="#6e7781" stroke-width="1.5"/>
<circle class="dot" cx="677.3" cy="76" r="6" fill="#0969da"/>
<text class="ink" x="844" y="80.5" font-size="12.5" fill="#1f2328" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">+60.8 pp</text>
<text class="ink" x="16" y="120.5" font-size="13.5" fill="#1f2328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Qwen3.5-0.8B</text>
<line class="bar" x1="412.4" y1="116" x2="694.9" y2="116" stroke="#d0d7de" stroke-width="2"/>
